<!DOCTYPE html>
<html>
<body>

  <script>
     
     
     function unique(arr){
        let arra = [];
        for(let item of arr){
            if(!arra.includes(item)){
            arra.push(item);
            }
        }
        return (arra);
     }

     let values = ["Hare", "Krishna", "Hare", "Krishna",
      "Krishna", "Krishna", "Hare", "Hare", ":-O"];

      alert( unique(values) ); // Hare, Krishna, :-O

  </script>

</body>
</html>
