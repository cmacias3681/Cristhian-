        function up_down_col_sort(matriz) {

            const rows = matriz.length;
            const cols = matriz[0].length;

            const sorted = matriz.flat().sort((a, b) => a - b);

            const result = Array.from({ length: rows }, () => new Array(cols)); //crea la matriz vacia

            let idx = 0;

            for (let col = 0; col < cols; col++) {
                if (col % 2 === 0) {
                    for (let row = 0; row < rows; row++) {
                        result[row][col] = sorted[idx++];
                    }
                } else {
                    for (let row = rows - 1; row >= 0; row--) {
                        result[row][col] = sorted[idx++];
                    }
                }
            }

            return result;
        }
